name: Deploy sync Worker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_IN_AUTOMATION: true
  TF_INPUT: false

on:
  workflow_call:
    outputs:
      sync_endpoint:
        description: Deployed sync Worker endpoint.
        value: ${{ jobs.deploy.outputs.sync_endpoint }}
  workflow_dispatch:

concurrency:
  group: deploy-sync-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      sync_endpoint: ${{ steps.endpoint.outputs.sync_endpoint }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12.0"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Check deployment secrets
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY secret}"
          : "${TF_VAR_turnstile_site_key:?Missing TURNSTILE_SITE_KEY secret}"
          : "${TF_VAR_turnstile_secret_key:?Missing TURNSTILE_SECRET_KEY secret}"

      - name: Build Worker
        working-directory: worker
        run: |
          cargo install worker-build --locked
          worker-build --release

      - name: Configure R2 backend
        working-directory: worker/terraform
        run: |
          {
            echo 'bucket = "deezer-bpm-terraform-state"'
            echo 'endpoints = {'
            echo "  s3 = \"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\""
            echo '}'
          } > backend.hcl
          chmod 600 backend.hcl

      - name: Initialize Terraform
        working-directory: worker/terraform
        run: terraform init -backend-config=backend.hcl

      - name: Plan deployment
        working-directory: worker/terraform
        run: terraform plan -out=tfplan

      - name: Apply deployment
        working-directory: worker/terraform
        run: terraform apply -auto-approve tfplan

      - name: Resolve sync endpoint
        id: endpoint
        working-directory: worker/terraform
        run: |
          WORKER_NAME=$(terraform output -raw worker_name)
          WORKERS_SUBDOMAIN=$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" |
              jq -er '.result.subdomain | select(type == "string" and length > 0)'
          )
          SYNC_ENDPOINT="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "sync_endpoint=${SYNC_ENDPOINT}" >> "$GITHUB_OUTPUT"
